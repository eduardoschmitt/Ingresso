name: ingresso

# Phase 0: PostgreSQL only. No Redis, queues, or reverse proxy yet.
# Phase 2: Prometheus + Grafana for load-test observability (local only).
services:
  db:
    image: postgres:16-alpine
    container_name: ingresso-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ingresso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ingresso}
      POSTGRES_DB: ${POSTGRES_DB:-ingresso}
    ports:
      # Host port is configurable: set DB_PORT in `.env` when 5432 is taken
      # by a local PostgreSQL (see README troubleshooting).
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-ingresso} -d $${POSTGRES_DB:-ingresso}']
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: ingresso-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - '${PROM_PORT:-9090}:9090'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9090/-/healthy']
      interval: 10s
      timeout: 3s
      retries: 5

  grafana:
    image: grafana/grafana:12.4.9
    container_name: ingresso-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      # Required secret: define GRAFANA_ADMIN_PASSWORD in the local `.env`
      # (gitignored). No default is versioned, not even for development.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?define GRAFANA_ADMIN_PASSWORD in your local .env (see .env.example)}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - '${GRAFANA_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  promdata:
  grafanadata:
