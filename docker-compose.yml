name: ingresso

# Phase 0: PostgreSQL only. No Redis, queues, or reverse proxy yet.
services:
  db:
    image: postgres:16-alpine
    container_name: ingresso-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ingresso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ingresso}
      POSTGRES_DB: ${POSTGRES_DB:-ingresso}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-ingresso} -d $${POSTGRES_DB:-ingresso}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
